[package]
name = "ikigai-diagram"
version = "0.2.3"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A kernel's arrangement as a picture: urn:diagram:* renders the resolution topology (urn:kernel:topology, or any declaration of a space) as an accessible, deterministic SVG of nested boxes."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-diagram"
homepage = "https://github.com/ikigai-rs/ikigai-diagram"
readme = "README.md"
keywords = ["ikigai", "roc", "svg", "diagram", "module"]
categories = ["visualization", "wasm"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use, so
# a host links exactly one `ikigai-core`. 0.1.109 is the true minimum: it
# exposes dynamic spaces and their declaration IRIs in the topology.
# Under 0.x caret rules this is also a CEILING (<0.2.0), which is the
# line every module shares.
ikigai-core = { version = "0.1.109", features = ["declare"] }

# The ecosystem's ONE escaping module (`ikigai_fn::html`, ledger #1813): every piece of
# text the renderer writes into the SVG goes through it. ⚠ Under 0.x caret rules this is
# also a CEILING (<0.6.0).
ikigai-fn = "0.5.0"

# The state overlay reads `urn:throttle:state`'s Turtle face. The same parser core's
# `declare` feature already links (so no new crate enters the graph), at core's own
# floors. ⚠ Under 0.x caret rules these are CEILINGS too (<0.3.0, <0.4.0).
oxttl = "0.2.3"
oxrdf = "0.3.0"

[dev-dependencies]
futures = "0.3"
# The module recipe as one test (`tests/conformance.rs`). 0.10.0 is the current
# definition of "done": 0.9 added core 0.1.105's contract-shape checks and RECOMPUTE,
# 0.10 adds FAILURES (off unless a suite opts in with `check_failures()`, which this
# one does not yet). ⚠ ^0.10 = <0.11: a CEILING, so a later minor is adopted
# deliberately, not silently.
ikigai-conformance = "0.10.0"
# The contrast floor this ecosystem enforces (`tests/contrast.rs`): `ratio` and the
# thresholds, from the crate that owns them, rather than a second copy of the WCAG
# math. A dev-dependency only — the palette is constant, so checking it is a test,
# and the library itself pays nothing for it.
ikigai-a11y = "0.2.1"
# ★ The REPL engine, for `tests/pipeline.rs`: whether `source urn:diagram:arrangement
# urn:kernel:topology` lands the value in `of` is decided by the engine's routing
# rule, which no kernel-level test can see.
ikigai-engine = "0.1.32"
# The engine reads each contract as `Meta as=application/json`; the test kernel must
# answer it, or the engine fails open and the pipeline tests prove nothing.
serde_json = "1"
