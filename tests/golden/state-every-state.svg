<g id="ikds-1504db42a6d35012-status" role="status" aria-live="polite" aria-atomic="true">
<g>
<rect class="ikd-box" x="16" y="908" width="928" height="252" rx="4"/>
<rect class="ikd-t-state" x="17" y="909" width="926" height="26" rx="3"/>
<text x="24" y="926"><tspan class="ikd-x ikd-b">Governor state</tspan><tspan class="ikd-x">  4 governors</tspan></text>
<text x="24" y="954"><tspan class="ikd-x ikd-b">breaker, a circuit breaker, governs urn:iki:space:demo-breaker (drawn above); trips after 2, cooldown 30s.</tspan></text>
<text x="40" y="974"><tspan class="ikd-x">Circuit urn:demo:breaker:down: half-open, 2 consecutive transient failures.</tspan></text>
<text x="40" y="994"><tspan class="ikd-x">Circuit urn:demo:breaker:flaky: closed, 1 consecutive transient failure.</tspan></text>
<text x="24" y="1018"><tspan class="ikd-x ikd-b">dr, a failover over 2 candidates: candidate 0 governs urn:iki:space:demo-primary (not in this arrangement);</tspan></text>
<text x="24" y="1038"><tspan class="ikd-x ikd-b">candidate 1 governs urn:iki:space:demo-backup (drawn above).</tspan></text>
<text x="40" y="1058"><tspan class="ikd-x">Route urn:demo:dr:x: failed, last call ended at candidate 1.</tspan></text>
<text x="24" y="1082"><tspan class="ikd-x ikd-b">limit, a rate limit, governs urn:iki:space:demo-limit (drawn above).</tspan></text>
<text x="40" y="1102"><tspan class="ikd-x">Window urn:demo:limit:: full, 3 of 3 per 10s.</tspan></text>
<text x="24" y="1126"><tspan class="ikd-x ikd-b">pool, a throttle, governs urn:iki:space:demo-pool (drawn above).</tspan></text>
<text x="40" y="1146"><tspan class="ikd-x">Bulkhead urn:demo:pool:: full, 1 of 1 running, 1 parked.</tspan></text>
<rect class="ikd-k-state" x="16" y="908" width="928" height="252" rx="4" fill="none" stroke-width="1.5"/>
</g>
</g>
