<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="960" height="1176" viewBox="0 0 960 1176" role="group" aria-labelledby="ikds-1504db42a6d35012-title" class="ikd">
<title id="ikds-1504db42a6d35012-title">Resolution arrangement: urn:ikigai:chain:root, with governor state</title>
<desc id="ikds-1504db42a6d35012-desc">The resolution chain one request sees: the root alone. In all: 1 fallback, 1 mount, 1 opaque space; and 9 doors across 5 endpoint spaces. Named spaces, in the order drawn: urn:iki:space:demo-limit, urn:iki:space:demo-breaker, urn:iki:space:demo-pool, urn:iki:space:demo-backup. Over it, the state of 4 governors, drawn in the box of each space governed and stated in words below the picture.</desc>
