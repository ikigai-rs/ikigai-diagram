<rect class="ikd-bg" width="960" height="428"/>
<g>
<rect class="ikd-box" x="16" y="16" width="928" height="396" rx="4"/>
<rect class="ikd-t-chain" x="17" y="17" width="926" height="46" rx="3"/>
<text x="24" y="34"><tspan class="ikd-x ikd-b">Chain</tspan><tspan class="ikd-x">  the caller&apos;s view: corridors innermost first, then the root</tspan></text>
<text x="24" y="54"><tspan class="ikd-m">urn:ikigai:chain:root</tspan></text>
<g>
<rect class="ikd-box" x="32" y="72" width="904" height="332" rx="4"/>
<rect class="ikd-t-fallback" x="33" y="73" width="902" height="26" rx="3"/>
<text x="40" y="90"><tspan class="ikd-m">root · </tspan><tspan class="ikd-x ikd-b">Fallback</tspan><tspan class="ikd-x">  3 layers consulted in order; the first hit wins</tspan></text>
<g>
<rect class="ikd-box" x="48" y="108" width="880" height="96" rx="4"/>
<rect class="ikd-t-endpoints" x="49" y="109" width="878" height="46" rx="3"/>
<text x="56" y="126"><tspan class="ikd-m">layer 1 · </tspan><tspan class="ikd-x ikd-b">Endpoints</tspan><tspan class="ikd-x">  2 doors tried in order; the first match wins</tspan></text>
<text x="56" y="146"><tspan class="ikd-m">urn:iki:space:diagram</tspan></text>
<g><title>door 1: urn:diagram:arrangement (exact) is answered by diagram-arrangement</title>
<text x="56" y="174"><tspan class="ikd-m">1</tspan></text>
<text x="72" y="174"><tspan class="ikd-x">urn:diagram:arrangement</tspan></text>
<text x="264" y="174"><tspan class="ikd-m">→</tspan></text>
<text x="280" y="174"><tspan class="ikd-x ikd-b">diagram-arrangement</tspan></text>
<text x="440" y="174"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<g><title>door 2: urn:diagram:kernel (exact) is answered by diagram-kernel</title>
<text x="56" y="194"><tspan class="ikd-m">2</tspan></text>
<text x="72" y="194"><tspan class="ikd-x">urn:diagram:kernel</tspan></text>
<text x="264" y="194"><tspan class="ikd-m">→</tspan></text>
<text x="280" y="194"><tspan class="ikd-x ikd-b">diagram-kernel</tspan></text>
<text x="440" y="194"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<rect class="ikd-k-endpoints" x="48" y="108" width="880" height="96" rx="4" fill="none" stroke-width="1.5"/>
</g>
<g>
<rect class="ikd-box" x="48" y="212" width="880" height="56" rx="4"/>
<rect class="ikd-t-endpoints" x="49" y="213" width="878" height="26" rx="3"/>
<text x="56" y="230"><tspan class="ikd-m">layer 2 · </tspan><tspan class="ikd-x ikd-b">Endpoints</tspan><tspan class="ikd-x">  1 door tried in order; the first match wins</tspan></text>
<g><title>door 1: urn:example:echo:{text} (template) is answered by echo</title>
<text x="56" y="258"><tspan class="ikd-m">1</tspan></text>
<text x="72" y="258"><tspan class="ikd-x">urn:example:echo:{text}</tspan></text>
<text x="264" y="258"><tspan class="ikd-m">→</tspan></text>
<text x="280" y="258"><tspan class="ikd-x ikd-b">echo</tspan></text>
<text x="320" y="258"><tspan class="ikd-mk-template">template</tspan></text>
</g>
<rect class="ikd-k-endpoints" x="48" y="212" width="880" height="56" rx="4" fill="none" stroke-width="1.5"/>
</g>
<g>
<rect class="ikd-box" x="48" y="276" width="880" height="120" rx="4"/>
<rect class="ikd-t-mount" x="49" y="277" width="878" height="26" rx="3"/>
<text x="56" y="294"><tspan class="ikd-m">layer 3 · </tspan><tspan class="ikd-x ikd-b">Mount</tspan><tspan class="ikd-x">  urn:mirror:</tspan></text>
<g>
<rect class="ikd-box" x="64" y="312" width="856" height="76" rx="4"/>
<rect class="ikd-t-endpoints" x="65" y="313" width="854" height="46" rx="3"/>
<text x="72" y="330"><tspan class="ikd-x ikd-b">Endpoints</tspan></text>
<text x="72" y="350"><tspan class="ikd-m">urn:iki:space:diagram</tspan></text>
<text x="72" y="378"><tspan class="ikd-m">drawn above: the same space, reached again</tspan></text>
<rect class="ikd-k-endpoints" x="64" y="312" width="856" height="76" rx="4" fill="none" stroke-width="1.5"/>
</g>
<rect class="ikd-k-mount" x="48" y="276" width="880" height="120" rx="4" fill="none" stroke-width="1.5"/>
</g>
<rect class="ikd-k-fallback" x="32" y="72" width="904" height="332" rx="4" fill="none" stroke-width="1.5"/>
</g>
<rect class="ikd-k-chain" x="16" y="16" width="928" height="396" rx="4" fill="none" stroke-width="1.5"/>
