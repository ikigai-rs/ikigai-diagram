<svg xmlns="http://www.w3.org/2000/svg" width="960" height="428" viewBox="0 0 960 428" role="img" aria-labelledby="ikd-e04c90e4965f8947-title ikd-e04c90e4965f8947-desc" class="ikd">
<title id="ikd-e04c90e4965f8947-title">Resolution arrangement: urn:ikigai:chain:root</title>
<desc id="ikd-e04c90e4965f8947-desc">The resolution chain one request sees: the root alone. In all: 1 fallback, 1 mount; and 3 doors across 2 endpoint spaces. Named spaces, in the order drawn: urn:iki:space:diagram.</desc>
