<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1356" viewBox="0 0 960 1356" role="img" aria-labelledby="ikd-242396487c3d65cd-title ikd-242396487c3d65cd-desc" class="ikd">
<title id="ikd-242396487c3d65cd-title">Resolution arrangement: urn:ikigai:chain:root</title>
<desc id="ikd-242396487c3d65cd-desc">The resolution chain one request sees: 1 corridor, innermost first, then the root. In all: 1 fallback, 1 mount, 1 alias, 1 level, 1 limit, 1 confine, 1 rewrite, 2 opaque spaces; and 10 doors across 7 endpoint spaces, with 2 alias rules; 1 door confines its endpoint&apos;s sub-requests. Holes, where a name resolves as unbound: urn:personal: (prefix). Named spaces, in the order drawn: urn:example:corridor:game:42, urn:example:space:host, urn:example:space:mod, urn:example:corridor:sandbox, urn:example:level:tenant, urn:example:peer:remote.</desc>
<style>.ikd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}.ikd-b{font-weight:700}.ikd-hole{stroke-dasharray:6 4}.ikd-dim{stroke-dasharray:2 3}.ikd-bg{fill:#ffffff}.ikd-box{fill:#ffffff}.ikd-x{fill:#1f2328}.ikd-m{fill:#59636e}.ikd-k-chain{stroke:#59636e}.ikd-t-chain{fill:#f6f8fa}.ikd-k-fallback{stroke:#0969da}.ikd-t-fallback{fill:#ddf4ff}.ikd-k-mount{stroke:#1a7f37}.ikd-t-mount{fill:#dafbe1}.ikd-k-alias{stroke:#8250df}.ikd-t-alias{fill:#fbefff}.ikd-k-limit{stroke:#cf222e}.ikd-t-limit{fill:#ffebe9}.ikd-k-level{stroke:#9a6700}.ikd-t-level{fill:#fff8c5}.ikd-k-endpoints{stroke:#1b7c83}.ikd-t-endpoints{fill:#dff7f5}.ikd-k-opaque{stroke:#818b98}.ikd-t-opaque{fill:#f6f8fa}.ikd-k-rewrite{stroke:#bc4c00}.ikd-t-rewrite{fill:#fff1e5}.ikd-k-confine{stroke:#953800}.ikd-t-confine{fill:#fff1e5}.ikd-k-unknown{stroke:#59636e}.ikd-t-unknown{fill:#f6f8fa}.ikd-k-problem{stroke:#cf222e}.ikd-t-problem{fill:#ffebe9}.ikd-mk-exact{fill:#59636e}.ikd-mk-template{fill:#0969da}.ikd-mk-prefix{fill:#1a7f37}.ikd-mk-custom{fill:#cf222e}@media (prefers-color-scheme:dark){.ikd-bg{fill:#0d1117}.ikd-box{fill:#0d1117}.ikd-x{fill:#e6edf3}.ikd-m{fill:#9198a1}.ikd-k-chain{stroke:#9198a1}.ikd-t-chain{fill:#161b22}.ikd-k-fallback{stroke:#4493f8}.ikd-t-fallback{fill:#0c1f3a}.ikd-k-mount{stroke:#3fb950}.ikd-t-mount{fill:#0d2416}.ikd-k-alias{stroke:#ab7df8}.ikd-t-alias{fill:#1d1533}.ikd-k-limit{stroke:#f85149}.ikd-t-limit{fill:#2a1214}.ikd-k-level{stroke:#d29922}.ikd-t-level{fill:#261e0c}.ikd-k-endpoints{stroke:#39c5cf}.ikd-t-endpoints{fill:#0b2326}.ikd-k-opaque{stroke:#768390}.ikd-t-opaque{fill:#161b22}.ikd-k-rewrite{stroke:#db6d28}.ikd-t-rewrite{fill:#28190d}.ikd-k-confine{stroke:#f0883e}.ikd-t-confine{fill:#28190d}.ikd-k-unknown{stroke:#9198a1}.ikd-t-unknown{fill:#161b22}.ikd-k-problem{stroke:#f85149}.ikd-t-problem{fill:#2a1214}.ikd-mk-exact{fill:#9198a1}.ikd-mk-template{fill:#4493f8}.ikd-mk-prefix{fill:#3fb950}.ikd-mk-custom{fill:#f85149}}</style>
