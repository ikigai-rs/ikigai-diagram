<text x="224" y="190"><tspan class="ikd-x ikd-b">live-hello</tspan></text>
<text x="312" y="190"><tspan class="ikd-mk-exact">exact</tspan></text>
</g>
<rect class="ikd-k-endpoints" x="64" y="144" width="856" height="56" rx="4" fill="none" stroke-width="1.5"/>
</g>
<rect class="ikd-k-mount" x="48" y="108" width="880" height="100" rx="4" fill="none" stroke-width="1.5"/>
</g>
<g>
<rect class="ikd-box" x="48" y="216" width="880" height="56" rx="4"/>
<rect class="ikd-t-opaque" x="49" y="217" width="878" height="26" rx="3"/>
<text x="56" y="234"><tspan class="ikd-m">layer 2 · </tspan><tspan class="ikd-x ikd-b">Opaque</tspan></text>
<text x="56" y="262"><tspan class="ikd-m">reports no structure: what the graph knows stops here</tspan></text>
