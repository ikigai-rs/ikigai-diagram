<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" lang="en" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="ikd-f714931c520bd978-title ikd-f714931c520bd978-desc" class="ikd">
<title id="ikd-f714931c520bd978-title">Space arrangement: urn:example:space:live</title>
<desc id="ikd-f714931c520bd978-desc">An arrangement whose outermost space is a dynamic space. In all: 1 fallback, 1 mount, 1 dynamic space, 1 opaque space; and 1 door across 1 endpoint space.</desc>
