ll:#9198a1}.ikd-mk-template{fill:#4493f8}.ikd-mk-prefix{fill:#3fb950}.ikd-mk-custom{fill:#f85149}}</style>
<rect class="ikd-bg" width="960" height="304"/>
<g>
<rect class="ikd-box" x="16" y="16" width="928" height="272" rx="4"/>
<rect class="ikd-t-dynamic" x="17" y="17" width="926" height="46" rx="3"/>
<text x="24" y="34"><tspan class="ikd-x ikd-b">Dynamic space</tspan><tspan class="ikd-x">  urn:example:declaration:live</tspan></text>
<text x="24" y="54"><tspan class="ikd-m">urn:example:space:live</tspan></text>
<g>
<rect class="ikd-box" x="32" y="72" width="904" height="208" rx="4"/>
<rect class="ikd-t-fallback" x="33" y="73" width="902" height="26" rx="3"/>
<text x="40" y="90"><tspan class="ikd-x ikd-b">Fallback</tspan><tspan class="ikd-x">  2 layers consulted in order; the first hit wins</tspan></text>
<g>
<rect class="ikd-box" x="48" y="108" width="880" height="100" rx="4"/>
<rect class="ikd-t-mount" x="49" y="109" width="878" height="26" rx="3"/>
<text x="56" y="126"><tspan class="ikd-m">layer 1 · </tspan><tspan class="ikd-x ikd-b">Mount</tspan><tspan class="ikd-x">  urn:live:</tspan></text>
