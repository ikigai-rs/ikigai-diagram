<g><title>door 1: urn:live:hello (exact) is answered by live-hello</title>
<text x="72" y="190"><tspan class="ikd-m">1</tspan></text>
<text x="88" y="190"><tspan class="ikd-x">urn:live:hello</tspan></text>
